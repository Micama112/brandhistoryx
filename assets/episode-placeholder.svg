<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Brand History X — The next story</title>
  <desc id="desc">A dark editorial placeholder for a future Brand History X episode.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11110f"/>
      <stop offset="0.55" stop-color="#070707"/>
      <stop offset="1" stop-color="#15120a"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DEA806" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DEA806" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#DEA806" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <path d="M0 575 770 0h310L120 720H0Z" fill="#F5F3EE" opacity="0.025"/>
  <path d="m558 0 722 524v196h-122L325 115 484 0Z" fill="#F5F3EE" opacity="0.025"/>
  <path d="M270 720 1120 0" fill="none" stroke="#DEA806" stroke-opacity="0.16" stroke-width="2"/>
  <path d="m410 0 870 650" fill="none" stroke="#F5F3EE" stroke-opacity="0.08" stroke-width="2"/>
  <ellipse cx="925" cy="365" rx="250" ry="150" fill="#DEA806" opacity="0.045" filter="url(#softGlow)"/>

  <g fill="none" stroke="#F5F3EE" stroke-opacity="0.13">
    <rect x="48" y="48" width="1184" height="624"/>
    <path d="M48 155h1184M48 565h1184"/>
  </g>

  <text x="92" y="118" fill="#DEA806" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="8">BRAND HISTORY X</text>
  <text x="92" y="342" fill="#F5F3EE" font-family="Arial Narrow, Arial, sans-serif" font-size="118" font-weight="700" letter-spacing="2">THE NEXT</text>
  <text x="92" y="462" fill="#F5F3EE" font-family="Arial Narrow, Arial, sans-serif" font-size="118" font-weight="700" letter-spacing="2">STORY.</text>
  <rect x="92" y="514" width="530" height="3" fill="url(#goldFade)"/>
  <text x="92" y="618" fill="#9E9D97" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6">HUMAN STORIES • ICONIC COMPANIES</text>
  <text x="1160" y="618" fill="#DEA806" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="4">COMING SOON</text>
